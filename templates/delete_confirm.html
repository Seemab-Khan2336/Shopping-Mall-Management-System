{% extends 'inventory/base.html' %}

{% block content %}
<div class="row justify-content-center m-5">
    <div class="col-md-5">
        <div class="card border-0 shadow p-5 text-center">
            <div class="card-body">
                <h3 class="text-danger fw-bold mb-3">Confirm Deletion</h3>
                <p class="mb-4 text-muted">Are you sure you wish to completely drop <strong>"{{ product.name }}"</strong> from the database registry? This change is irreversible.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4 me-2">Yes, Confirm Delete</button>
                    <a href="{% url 'product_list' %}" class="btn btn-secondary px-4">Cancel Execution</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
